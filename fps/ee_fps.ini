; Ego-Shooter-Modus fuer Empire Earth (nur Einzelspieler, nur "Empire Earth (Cheats)")
;
; Bedienung im Spiel:
;   EINE eigene Fernkampf-Einheit auswaehlen (Musketier, Schuetze, Scharfschuetze, MG, Bogenschuetze ...)
;   Umschalttaste (Standard: ^ links neben der 1)  -> Ego-Ansicht
;   Maus = umsehen, W/A/S/D = laufen (Shift = kleine Schritte)
;   linke Maustaste: Klick = ein Schuss, gedrueckt halten = Dauerfeuer; rechte Maustaste = Zielfernrohr (AWP)
;   1/2/3/4 oder Mausrad = Waffe wechseln, Q = letzte Waffe
;   Unten links: Lebensbalken des Helden und die Waffenplaetze (gruen = aktive Waffe)
;   ^ oder ESC = zurueck in die normale Ansicht. Stirbt die Einheit, geht es automatisch zurueck.
;
; Tastencodes sind DirectInput-Codes (hex): ^ = 0x29, F = 0x21, Tab = 0x0F, V = 0x2F, Einfg = 0xD2

[Steuerung]
Umschalttaste=0x29
Mausempfindlichkeit=0.0025
MausYInvertieren=0

[Kamera]
Augenhoehe=0.65
Vorversatz=0.35
MaxNeigungGrad=60
; 0 = wie im Spiel (ca. 0.79)
Sichtfeld=0
NahClip=0.05
FernClip=70
; Farbe hinter der Welt, falls kein Himmel gezeichnet wird (hex RRGGBB)
Himmelfarbe=0x7FA6CC
; wie weit vor der Einheit das Spiel die Welt aufbaut (Felder)
WeltVorlauf=6

[Fadenkreuz]
Farbe=0x30FF30
TrefferFarbe=0xFF3030
Groesse=1.0
; 1 = Lebensbalken und Waffenplaetze anzeigen
Anzeige=1

[Held]
; die gesteuerte Einheit wird zum Helden, beim Verlassen wird alles zurueckgesetzt
LebenFaktor=10
ErlittenerSchadenFaktor=0.35
RegenerationProzentProSekunde=1
; Einheiten-Verhalten waehrend der Ego-Ansicht (Spieltabelle 0..7). 6 = laeuft Feinden nicht hinterher,
; schiesst aber selbst auf Feinde in Reichweite. Beim Verlassen wird das alte Verhalten wiederhergestellt.
Verhalten=6
; Reichweite: Gewehrschuetzen bekommen mindestens MinReichweite. Boegen/Schleudern/Speere koennen nicht weiter
; als ihre eigene Reichweite treffen - dort stellt sich der Modus nach ein paar Fehlversuchen selbst zurueck.
MinReichweite=9
MinSichtweite=12

[Zielen]
; wie gross ein Ziel fuer das Fadenkreuz ist (Felder)
Trefferradius=0.55
Laufschritt=2.5

; Waffen: NachladezeitMs=0 bedeutet "wie die Einheit selbst"; SchadenFaktor multipliziert den Schaden der Einheit;
; Zoom > 1 = rechte Maustaste schaltet ein Zielfernrohr mit dieser Vergroesserung
[Waffe1]
Name=Standardwaffe
NachladezeitMs=0
SchadenFaktor=2.0
Reichweite=9

[Waffe2]
Name=AK-47
NachladezeitMs=250
SchadenFaktor=1.2
Reichweite=10

[Waffe3]
Name=AWP
NachladezeitMs=2600
SchadenFaktor=12
Reichweite=16
Zoom=4

[Waffe4]
Name=Desert Eagle
NachladezeitMs=700
SchadenFaktor=3.5
Reichweite=9
