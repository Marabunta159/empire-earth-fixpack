; First-person mode for Empire Earth (single player only, only in "Empire Earth (Cheats)" = EE-Cheats.exe)
; UNFINISHED EXPERIMENT - not developed any further, no support. The source code (ee_fps.cpp) comes with the
; fix pack ("Source code..." button); feel free to continue it.
;
; How to use it in the game:
;   select ONE of your own ranged units (musketeer, rifleman, sniper, machine gunner, archer ...)
;   press the toggle key (default: the key left of 1 - "`" on a US keyboard, "^" on a German one)
;   mouse = look around, W/A/S/D = walk (Shift = small steps)
;   left mouse button: click = one shot, hold = continuous fire; right mouse button = scope (AWP)
;   1/2/3/4 or mouse wheel = change weapon, Q = previous weapon
;   bottom left: health bar of the hero and the weapon slots (green = active weapon)
;   toggle key or ESC = back to the normal view. If the unit dies you get back automatically.
;
; The section and key names are German because the add-on reads them that way - only change the values.
; Key codes are DirectInput codes (hex): key left of 1 = 0x29, F = 0x21, Tab = 0x0F, V = 0x2F, Insert = 0xD2

[Steuerung]
; language of the in-game messages: en or de
Sprache=en
; toggle key
Umschalttaste=0x29
; mouse sensitivity
Mausempfindlichkeit=0.0025
; 1 = invert the vertical mouse axis
MausYInvertieren=0

[Kamera]
; eye height
Augenhoehe=0.65
; camera offset to the front
Vorversatz=0.35
; how far you can look up / down (degrees)
MaxNeigungGrad=60
; field of view, 0 = same as the game (about 0.79)
Sichtfeld=0
; near / far clipping distance
NahClip=0.05
FernClip=70
; colour behind the world when no sky is drawn (hex RRGGBB)
Himmelfarbe=0x7FA6CC
; how far ahead of the unit the game builds the world (tiles)
WeltVorlauf=6

[Fadenkreuz]
; crosshair colour / colour when aiming at a target / size
Farbe=0x30FF30
TrefferFarbe=0xFF3030
Groesse=1.0
; 1 = show health bar and weapon slots
Anzeige=1

[Held]
; the controlled unit becomes a hero; everything is reset when you leave the mode
; health multiplier
LebenFaktor=10
; damage taken multiplier
ErlittenerSchadenFaktor=0.35
; health regeneration in percent per second
RegenerationProzentProSekunde=1
; unit behaviour during first-person mode (game table 0..7). 6 = does not run after enemies but shoots at
; enemies in range. The previous behaviour is restored when you leave the mode.
Verhalten=6
; range: riflemen get at least MinReichweite. Bows / slings / spears cannot hit farther than their own
; range - the mode switches back to it by itself after a few failed attempts.
MinReichweite=9
; minimum line of sight
MinSichtweite=12

[Zielen]
; how big a target is for the crosshair (tiles)
Trefferradius=0.55
; walking step
Laufschritt=2.5

; Weapons: NachladezeitMs (reload time) = 0 means "same as the unit"; SchadenFaktor multiplies the damage of the
; unit; Reichweite = range; Zoom > 1 = the right mouse button switches a scope with this magnification on
[Waffe1]
Name=Standard weapon
NachladezeitMs=0
SchadenFaktor=2.0
Reichweite=9

[Waffe2]
Name=AK-47
NachladezeitMs=250
SchadenFaktor=1.2
Reichweite=10

[Waffe3]
Name=AWP
NachladezeitMs=2600
SchadenFaktor=12
Reichweite=16
Zoom=4

[Waffe4]
Name=Desert Eagle
NachladezeitMs=700
SchadenFaktor=3.5
Reichweite=9
